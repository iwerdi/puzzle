<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь автосервиса</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        h2 {
            text-align: center;
            margin-bottom: 16px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-cell {
            background-color: var(--card-bg);
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            position: relative;
            cursor: pointer;
        }

        .month-event-card {
            background-color: var(--button-color);
            color: var(--button-text-color);
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 4px;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: grab;
            touch-action: none;
        }

        .month-event-card:active {
            cursor: grabbing;
        }

        .hours-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 75vh;
            overflow-y: auto;
            position: relative;
            padding-bottom: 40px;
        }

        .hour-row {
            display: flex;
            align-items: center;
            height: 40px;
            border-bottom: 1px solid var(--card-bg);
            font-size: 14px;
        }

        .hour-label {
            width: 60px;
            color: var(--hint-color);
            font-size: 12px;
        }

        .hour-slot {
            flex: 1;
            height: 36px;
            background-color: transparent;
            border-radius: 4px;
        }

        .booking-card {
            position: absolute;
            left: 65px;
            right: 10px;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            touch-action: none;
        }

        .resize-handle {
            height: 16px;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            cursor: ns-resize;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .resize-handle::after {
            content: '';
            width: 30px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--button-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="monthView" class="view active">
        <h2>Сентябрь 2026</h2>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div id="dayView" class="view">
        <button class="back-btn" id="backBtn">← Назад к месяцу</button>
        <h2 id="selectedDateTitle">День</h2>
        <div class="hours-container" id="hoursContainer"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
        }

        let appData = {
            "2026-09-06": { note: "Ремонт", startHour: 13, durationHours: 4 },
            "2026-09-15": { note: "ТО", startHour: 10, durationHours: 2 }
        };

        let currentSelectedDate = null;
        const rowHeight = 44;

        const calendarGrid = document.getElementById('calendarGrid');
        const monthView = document.getElementById('monthView');
        const dayView = document.getElementById('dayView');
        const hoursContainer = document.getElementById('hoursContainer');
        const selectedDateTitle = document.getElementById('selectedDateTitle');
        const backBtn = document.getElementById('backBtn');

        function renderMonth() {
            calendarGrid.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                let dayStr = i < 10 ? `0${i}` : `${i}`;
                let dateKey = `2026-09-${dayStr}`;

                let cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.dataset.date = dateKey;
                
                let dayNum = document.createElement('span');
                dayNum.textContent = i;
                cell.appendChild(dayNum);

                if (appData[dateKey]) {
                    let eventCard = document.createElement('div');
                    eventCard.className = 'month-event-card';
                    eventCard.textContent = appData[dateKey].note;
                    
                    initMonthDrag(eventCard, dateKey);
                    cell.appendChild(eventCard);
                }

                cell.addEventListener('click', (e) => {
                    if (e.target === cell || e.target === dayNum) {
                        openDayView(dateKey);
                    }
                });

                calendarGrid.appendChild(cell);
            }
        }

        function initMonthDrag(card, sourceDateKey) {
            card.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                
                let clone = card.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.zIndex = 1000;
                clone.style.pointerEvents = 'none';
                clone.style.width = `${card.offsetWidth}px`;
                document.body.appendChild(clone);

                function moveAt(pageX, pageY) {
                    clone.style.left = `${pageX - clone.offsetWidth / 2}px`;
                    clone.style.top = `${pageY - clone.offsetHeight / 2}px`;
                }

                moveAt(e.pageX, e.pageY);

                function onPointerMove(e) {
                    moveAt(e.pageX, e.pageY);
                }

                function onPointerUp(e) {
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    clone.remove();

                    let elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                    let targetCell = elemBelow ? elemBelow.closest('.day-cell') : null;

                    if (targetCell) {
                        let targetDateKey = targetCell.dataset.date;
                        if (targetDateKey && targetDateKey !== sourceDateKey) {
                            // Переносим объект со всеми его временными параметрами на новый день
                            appData[targetDateKey] = appData[sourceDateKey];
                            delete appData[sourceDateKey];

                            if (tg.HapticFeedback) {
                                tg.HapticFeedback.impactOccurred('medium');
                            }
                            renderMonth();
                        }
                    }
                }

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        }

        function openDayView(dateKey) {
            currentSelectedDate = dateKey;
            selectedDateTitle.textContent = `Дата: ${dateKey}`;
            monthView.classList.remove('active');
            dayView.classList.add('active');
            renderHours();
        }

        backBtn.addEventListener('click', () => {
            dayView.classList.remove('active');
            monthView.classList.add('active');
            renderMonth();
        });

        function renderHours() {
            hoursContainer.innerHTML = '';
            
            for (let h = 0; h < 24; h++) {
                let hourRow = document.createElement('div');
                hourRow.className = 'hour-row';

                let label = document.createElement('div');
                label.className = 'hour-label';
                label.textContent = `${h < 10 ? '0' + h : h}:00`;

                let slot = document.createElement('div');
                slot.className = 'hour-slot';

                hourRow.appendChild(label);
                hourRow.appendChild(slot);
                hoursContainer.appendChild(hourRow);
            }

            let dayData = appData[currentSelectedDate];
            if (dayData) {
                createDayResizeCard(dayData.startHour, dayData.durationHours, dayData.note);
            }
        }

        function createDayResizeCard(startHour, duration, note) {
            let card = document.createElement('div');
            card.className = 'booking-card';
            card.style.top = `${startHour * rowHeight + 4}px`;
            card.style.height = `${duration * rowHeight - 6}px`;
            card.innerHTML = `<span id="cardText"><b>${note}</b> (${startHour}:00, ${duration} ч.)</span><div class="resize-handle" id="resizeHandle"></div>`;

            hoursContainer.appendChild(card);

            let handle = card.querySelector('#resizeHandle');
            let cardText = card.querySelector('#cardText');

            handle.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                let startY = e.clientY;
                let initialHeight = card.offsetHeight;
                let currentStart = startHour;

                function onPointerMove(e) {
                    let deltaY = e.clientY - startY;
                    let newHeight = initialHeight + deltaY;
                    
                    let minH = rowHeight - 6;
                    let maxH = (24 - currentStart) * rowHeight;
                    
                    if (newHeight < minH) newHeight = minH;
                    if (newHeight > maxH) newHeight = maxH;

                    card.style.height = `${newHeight}px`;

                    let currentDuration = Math.round(newHeight / rowHeight);
                    cardText.innerHTML = `<b>${note}</b> (${currentStart}:00, ${currentDuration} ч.)`;
                }

                function onPointerUp() {
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);

                    let finalDuration = Math.round(card.offsetHeight / rowHeight);
                    if (appData[currentSelectedDate]) {
                        appData[currentSelectedDate].durationHours = finalDuration;
                    }
                    
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('medium');
                    }
                }

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        }

        renderMonth();
    </script>
</body>
</html>
