<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Пятнашки (Свайпы)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            touch-action: none; /* Отключаем стандартные свайпы браузера */
        }
        h2 { margin-bottom: 10px; font-size: 20px; }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 75px);
            grid-template-rows: repeat(4, 75px);
            gap: 6px;
            background: var(--tg-theme-secondary-bg-color, #222);
            padding: 10px;
            border-radius: 12px;
        }
        .tile {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .tile.empty {
            background: transparent;
        }
    </style>
</head>
<body>
    <h2>Пятнашки (Свайпы)</h2>
    <div class="board" id="board"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let tiles = [...Array(15).keys()].map(x => x + 1);
        tiles.push(null);

        function shuffle() {
            for (let i = tiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
            }
        }
        shuffle();

        function render() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            tiles.forEach((tile, index) => {
                const el = document.createElement('div');
                el.className = 'tile' + (tile === null ? ' empty' : '');
                el.textContent = tile !== null ? tile : '';
                board.appendChild(el);
            });
        }

        let startX = 0;
        let startY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (!startX || !startY) return;

            let endX = e.changedTouches[0].clientX;
            let endY = e.changedTouches[0].clientY;

            let diffX = endX - startX;
            let diffY = endY - startY;

            let threshold = 30; // Минимальная длина свайпа в пикселях

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    if (diffX > 0) moveDirection('right');
                    else moveDirection('left');
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    if (diffY > 0) moveDirection('down');
                    else moveDirection('up');
                }
            }

            startX = 0;
            startY = 0;
        }, { passive: false });

        function moveDirection(dir) {
            const emptyIndex = tiles.indexOf(null);
            const row = Math.floor(emptyIndex / 4);
            const col = emptyIndex % 4;

            let targetIndex = -1;

            // Свайп влево двигает фишку справа на место пустой
            if (dir === 'left' && col < 3) targetIndex = emptyIndex + 1;
            // Свайп вправо двигает фишку слева
            else if (dir === 'right' && col > 0) targetIndex = emptyIndex - 1;
            // Свайп вверх двигает фишку снизу
            else if (dir === 'up' && row < 3) targetIndex = emptyIndex + 4;
            // Свайп вниз двигает фишку сверху
            else if (dir === 'down' && row > 0) targetIndex = emptyIndex - 4;

            if (targetIndex !== -1) {
                tiles[emptyIndex] = tiles[targetIndex];
                tiles[targetIndex] = null;
                tg.HapticFeedback.impactOccurred('light');
                render();
            }
        }

        render();
    </script>
</body>
</html>
